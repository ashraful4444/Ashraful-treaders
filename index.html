<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>মেসার্স আশরাফুল ট্রেডার্স</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Hind Siliguri',sans-serif;
}

body{
background:#eef3ee;
color:#222;
}

/* HEADER */

header{
background:linear-gradient(135deg,#0d7a3f,#14934f);
color:white;
padding:20px;
}

.top-bar{
display:flex;
justify-content:center;
align-items:center;
position:relative;
text-align:center;
}

.logo h1{
font-size:42px;
}

.logo p{
font-size:18px;
margin-top:5px;
}

.contact-btn{
position:absolute;
right:0;
top:50%;
transform:translateY(-50%);
background:white;
color:#0d7a3f;
padding:10px 20px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

/* NAVBAR */

nav{
background:#04552c;
padding:14px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:18px;
font-weight:600;
}

/* HERO */

.hero{
height:520px;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url('YOUR-HERO-IMAGE.jpg') center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
color:white;
}

.hero-content h2{
font-size:55px;
margin-bottom:20px;
}

.hero-content p{
font-size:22px;
margin-bottom:25px;
}

.hero-btn{
display:inline-block;
padding:14px 30px;
background:#19a856;
color:white;
text-decoration:none;
font-size:20px;
border-radius:8px;
font-weight:bold;
}

/* CONTAINER */

.container{
width:92%;
max-width:1250px;
margin:auto;
padding:70px 0;
}

.section-title{
text-align:center;
font-size:42px;
margin-bottom:50px;
color:#0d7a3f;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.12);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.card-content{
padding:24px;
}

.card-content h3{
font-size:28px;
color:#0d7a3f;
margin-bottom:14px;
}

.card-content p{
font-size:17px;
line-height:1.8;
color:#444;
}

/* ABOUT */

.about{
background:white;
padding:45px;
border-radius:18px;
box-shadow:0 4px 18px rgba(0,0,0,.08);
line-height:1.9;
font-size:19px;
}

/* FEATURES */

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:45px;
}

.feature-box{
background:white;
padding:30px;
border-radius:16px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.feature-box h3{
color:#0d7a3f;
font-size:26px;
margin-bottom:10px;
}

.feature-box p{
font-size:17px;
line-height:1.7;
}

/* CONTACT */

.contact{
background:#0d7a3f;
color:white;
padding:70px 20px;
text-align:center;
}

.contact h2{
font-size:44px;
margin-bottom:20px;
}

.contact p{
font-size:20px;
margin:12px 0;
}

/* SOCIAL BUTTONS */

.social-btn{
display:inline-block;
margin:10px;
padding:14px 28px;
text-decoration:none;
color:white;
font-size:20px;
font-weight:bold;
border-radius:10px;
transition:.3s;
}

.social-btn:hover{
transform:translateY(-4px);
}

.facebook{
background:#1877F2;
}

.telegram{
background:#229ED9;
}

.gmail{
background:#EA4335;
}

/* FLOATING MESSENGER */

.floating-messenger{
position:fixed;
bottom:100px;
right:25px;
width:65px;
height:65px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 5px 15px rgba(0,0,0,.3);
z-index:999;
transition:.3s;
overflow:hidden;
}

.floating-messenger:hover{
transform:scale(1.1);
}

.floating-messenger img{
width:100%;
height:100%;
object-fit:cover;
}

/* FLOATING WHATSAPP */

.floating-whatsapp{
position:fixed;
bottom:25px;
right:25px;
width:65px;
height:65px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 5px 15px rgba(0,0,0,.3);
z-index:999;
transition:.3s;
overflow:hidden;
}

.floating-whatsapp:hover{
transform:scale(1.1);
}

.floating-whatsapp img{
width:100%;
height:100%;
object-fit:cover;
}

/* FOOTER */

footer{
background:#022814;
color:white;
text-align:center;
padding:20px;
font-size:16px;
}

/* MOBILE */

@media(max-width:768px){

.top-bar{
flex-direction:column;
gap:15px;
}

.contact-btn{
position:static;
transform:none;
}

.logo h1{
font-size:30px;
}

.logo p{
font-size:15px;
}

.hero{
height:420px;
}

.hero-content h2{
font-size:34px;
}

.hero-content p{
font-size:18px;
}

.section-title{
font-size:32px;
}

.social-btn{
display:block;
width:90%;
margin:12px auto;
font-size:18px;
}

.floating-whatsapp{
width:58px;
height:58px;
right:18px;
bottom:18px;
}

.floating-messenger{
width:58px;
height:58px;
right:18px;
bottom:88px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="top-bar">

<div class="logo"
